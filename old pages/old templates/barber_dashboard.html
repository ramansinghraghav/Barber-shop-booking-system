<!DOCTYPE html>
<html>
<head>
  <title>Barber Dashboard</title>

  <!-- Icons -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>

<body>

<div class="dashboard">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>✂️ Barber</h2>

    <a href="/barber/dashboard"><i class="fa fa-house"></i> Dashboard</a>
    <a href="/barber/shop"><i class="fa fa-store"></i> My Shop</a>
    <a href="/barber/services"><i class="fa fa-scissors"></i> Services</a>
    <a href="/barber/slots"><i class="fa fa-clock"></i> Generate Slots</a>
    <a href="/barber/bookings"><i class="fa fa-calendar"></i> Bookings</a>

    <a href="/logout"><i class="fa fa-right-from-bracket"></i> Logout</a>
  </div>

  <!-- MAIN -->
  <div class="main">
    <h1>Welcome Barber 👋</h1>
    <p class="subtitle">Manage your shop and bookings</p>

    <div class="cards">

      <div class="card blue" onclick="goToPage('/barber/shop')">
        <h3>My Shop</h3>
        <p>Add / Update shop details</p>
      </div>

      <div class="card purple" onclick="goToPage('/barber/services')">
        <h3>Services</h3>
        <p>Add haircut & services</p>
      </div>

      <div class="card green" onclick="goToPage('/barber/slots')">
        <h3>Generate Slots</h3>
        <p>Create today’s slots</p>
      </div>

    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
<script>
  checkLogin();
</script>

</body>
</html>
