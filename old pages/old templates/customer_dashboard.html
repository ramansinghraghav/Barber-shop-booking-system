<!DOCTYPE html>
<html>
<head>
  <title>Customer Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
 <style>
body {
    font-family: Arial, sans-serif;
}

.dashboard {
    display: flex;
}

.sidebar {
    width: 200px;
    background: #f5f5f5;
    padding: 20px;
}

.content {
    flex: 1;
    padding: 30px;
}
.main {
    flex: 1;
    padding: 30px;}
button {
    margin: 5px;
    padding: 10px 15px;
}
</style>
<div class="dashboard">
  <div class="sidebar">
    <h2>✂️ Barber</h2>

    <a href="/dashboard">Dashboard</a>
    <a href="/services">Services</a>
    <a href="/slots">Slots</a>
    <a href="/bookings">Bookings</a>
    <a href="/orders">My Orders</a>
    <a href="/profile">Profile</a>

    <a href="/logout">Logout</a>
  </div>


  <div class="main">
    <h1>Welcome Back 👋</h1>
    <p class="subtitle">Book your next appointment in seconds</p>

    <div class="cards">
      <div class="card blue" onclick="goToPage('/services')">
        <h3>Services</h3>
        <p>Browse all services</p>
      </div>

      <div class="card purple" onclick="goToPage('/slots')">
        <h3>Slots</h3>
        <p>Check availability</p>
      </div>

      <div class="card green" onclick="goToPage('/bookings')">
        <h3>My Bookings</h3>
        <p>View & cancel</p>
      </div>
      </div>
      </div>
  <script src="{{ url_for('static', filename='script.js') }}"></script>    
  <script>
    checkLogin();
</script>
</body>
</html>
